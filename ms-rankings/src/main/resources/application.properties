# =============================================
# ms-rankings - Puerto 8089
# =============================================
server.port=8089
spring.application.name=ms-rankings

spring.datasource.url=jdbc:mysql://localhost:3306/db_rankings?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# URLs de microservicios externos
microservicios.ms-equipos.url=http://localhost:8082/api/v1/equipos
microservicios.ms-jugadores.url=http://localhost:8081/api/v1/jugadores

logging.level.com.esports.msrankings=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
