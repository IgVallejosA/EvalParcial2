# =============================================
# MS-JUGADORES - Configuración del microservicio
# Puerto 8081 (cada micro usa un puerto distinto)
# =============================================

server.port=8081
spring.application.name=ms-jugadores

# =============================================
# DataSource MySQL - BD independiente por micro
# createDatabaseIfNotExist crea la BD automáticamente
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_jugadores?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA + Hibernate
# ddl-auto=update: crea/actualiza tablas sin borrar datos
# show-sql=true: muestra queries en consola (útil para defensa)
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =============================================
# Logs estructurados (SLF4J) - IE 2.3.2
# =============================================
logging.level.com.esports.msjugadores=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
