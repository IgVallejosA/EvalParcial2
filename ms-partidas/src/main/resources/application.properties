# =============================================
# ms-partidas - Puerto 8085
# =============================================
server.port=8085
spring.application.name=ms-partidas

spring.datasource.url=jdbc:mysql://localhost:3306/db_partidas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# URLs de microservicios externos
microservicios.ms-torneos.url=http://localhost:8084/api/v1/torneos
microservicios.ms-equipos.url=http://localhost:8082/api/v1/equipos

logging.level.com.esports.mspartidas=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
