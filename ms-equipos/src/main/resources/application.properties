# =============================================
# MS-EQUIPOS - Configuración del microservicio
# Puerto 8082 (ms-jugadores usa 8081)
# =============================================

server.port=8082
spring.application.name=ms-equipos

# =============================================
# DataSource MySQL - BD independiente
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_equipos?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA + Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =============================================
# URLs de microservicios externos (IE 2.4.1)
# Se externalizan en properties para no hardcodear en el código
# =============================================
microservicios.ms-jugadores.url=http://localhost:8081/api/v1/jugadores

# =============================================
# Logs estructurados (SLF4J)
# =============================================
logging.level.com.esports.msequipos=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
