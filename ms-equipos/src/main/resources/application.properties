server.port=8082
spring.application.name=ms-equipos

spring.datasource.url=jdbc:mysql://localhost:3306/ms_equipos
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

microservicios.ms-jugadores.url=http://localhost:8081/api/v1/jugadores

logging.level.com.esports.msequipos=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
