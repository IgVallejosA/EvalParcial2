# =============================================
# MS-JUEGOS - Configuración del microservicio
# Puerto 8083
# =============================================

server.port=8083
spring.application.name=ms-juegos

# =============================================
# DataSource MySQL - BD independiente
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_juegos?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA + Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =============================================
# Logs estructurados (SLF4J)
# =============================================
logging.level.com.esports.msjuegos=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
